name: Deploy INLINEASY CNG to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CNG website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r frontend/css _site/
          cp -r frontend/js _site/
          cp frontend/admin.html _site/
          cp frontend/bookingthree.html _site/
          cp frontend/bunktwo.html _site/
          cp frontend/step5.html _site/
          cp frontend/ticket.html _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
